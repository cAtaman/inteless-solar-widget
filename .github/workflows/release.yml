name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: bash scripts/verify-release-version.sh "${{ github.ref_name }}"
      - run: npm run package:release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "${{ github.ref_name }}"
